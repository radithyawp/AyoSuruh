workflows:
  ios-unsigned-ci:
    name: Ayo Suruh iOS - Unsigned CI
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.41.7
      xcode: 26.4
      cocoapods: default

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version
          dart --version

      - name: Create CI placeholder env
        script: |
          mkdir -p assets
          touch assets/.env
          echo "Created assets/.env for unsigned compile validation only."

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Build iOS without code signing
        script: |
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios-release-validation:
    name: Ayo Suruh iOS - Unsigned Release Validation
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.41.7
      xcode: 26.4
      cocoapods: default

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version
          dart --version

      - name: Create CI placeholder env
        script: |
          mkdir -p assets
          touch assets/.env
          echo "Created assets/.env for unsigned release compile validation only."

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Build iOS release without code signing
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
